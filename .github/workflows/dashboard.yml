name: dashboard

# Rebuilds docs/index.html from PSE data and deploys docs/ to GitHub Pages.
# Off by default: scheduled runs only act when the repository variable DASHBOARD_SCHEDULE is "on";
# a manual run (workflow_dispatch) always builds and deploys.
# Requires Settings > Pages > Source = "GitHub Actions". With Source = "Deploy from a branch" (main, /docs)
# the committed snapshot in docs/ is served instead and this workflow is not needed.

on:
  schedule:
    # Mondays: the previous week is complete. Thursdays only keep the data cache warm (GitHub evicts caches
    # that were not used for 7 days) and redeploy the same week.
    - cron: "40 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write            # keep-alive: re-enable this workflow so the schedule survives quiet months

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.DASHBOARD_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    # a cold cache downloads the hourly history 2020-2024 from the legacy PSE export (~110 slow requests)
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # monthly Parquet files of the PSE series; nothing is committed to the repository
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: pse-opendata-${{ github.run_id }}
          restore-keys: pse-opendata-

      # exits with code 2 when the API series or months of the legacy history are missing; then nothing is
      # deployed, the previously published page stays online and the next run resumes the download
      - name: Build dashboard
        run: python -m flex_ramps dashboard --out docs

      - name: Save data cache
        if: always() && hashFiles('data/**/*.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: pse-opendata-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # GitHub disables scheduled workflows after 60 days without repository activity
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/dashboard.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
